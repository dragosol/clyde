<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
</style>
</head>
<body>
  <svg width="1024" height="1024" viewBox="-20 -15 140 145" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="alive" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" seed="3" result="noise">
          <animate attributeName="seed" values="3;7;11;5;3" dur="3s" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <linearGradient id="pine-bright" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#3d7a42;stop-opacity:0.8"/>
        <stop offset="100%" style="stop-color:#6ab86a;stop-opacity:1"/>
      </linearGradient>
    </defs>
    <path d="M 84 16 C 104 36, 112 70, 96 92 C 80 114, 48 120, 22 106 C -4 92, -14 60, 0 36 C 14 12, 42 -4, 66 -2 C 84 0, 98 14, 98 32 C 98 52, 82 68, 64 72 C 44 76, 26 64, 22 46 C 18 28, 30 14, 46 12 C 60 10, 72 22, 72 36 C 72 48, 62 56, 52 56"
      fill="none" stroke="url(#pine-bright)" stroke-width="16" stroke-linecap="round"
      filter="url(#alive)"/>
  </svg>
</body>
</html>
